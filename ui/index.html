<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0b10">
<title>AOS-1 Agent Graph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%236d5efc'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
<script>/* no-flash theme: apply the saved choice before first paint (AUTO = no attribute) */
try{var t=localStorage.getItem('aos.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="styles.css?v=10">
<link rel="stylesheet" href="theme.css?v=19">
<link rel="stylesheet" href="global.css?v=2">
</head>
<body class="boot">
<div id="banner" class="toast toast-error" role="alert" hidden></div>
<div id="ctl-msg" class="toast toast-info" role="status"></div>

<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 28 28" aria-hidden="true">
      <defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#5b4bf0"/></linearGradient></defs>
      <rect width="28" height="28" rx="8" fill="url(#lg1)"/>
      <circle cx="14" cy="14" r="3.2" fill="#fff"/>
      <circle cx="14" cy="14" r="7.4" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/>
      <circle cx="14" cy="5.6" r="1.5" fill="#fff"/><circle cx="21.3" cy="18.2" r="1.5" fill="#fff"/><circle cx="6.7" cy="18.2" r="1.5" fill="#fff"/>
    </svg>
    <h1>AOS-1</h1>
  </div>

  <button id="goalbar" class="goalbar" type="button" aria-label="Goal and success criteria. Open orchestrator details">
    <span id="goal-title" class="goal-title skeleton-text">Loading…</span>
    <span id="goal-status" class="pill" hidden></span>
    <span id="goal-segs" class="segs" role="progressbar" aria-label="Success criteria met" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span>
    <span id="goal-count" class="goal-count tnum"></span>
  </button>

  <div id="live-ind" class="live-ind" hidden tabindex="0" role="status" title="Observing Claude Code via hooks. Controls are disabled in live mode." aria-label="Live. Read-only. Observing Claude Code via hooks. Controls are disabled in live mode."><i class="li-dot"></i><b>Live</b><span>Read-only</span></div>

  <button id="theme-btn" class="theme-btn" type="button" data-state="auto" aria-label="Theme: auto (follows system). Switch to light" title="Theme: auto (follows system). Click or press T to switch to light"><svg viewBox="0 0 16 16" aria-hidden="true"><g class="ti-auto"><circle cx="8" cy="8" r="5.2" fill="none"/><path d="M8 2.8a5.2 5.2 0 0 1 0 10.4z" stroke="none"/></g><g class="ti-light"><circle cx="8" cy="8" r="2.8" fill="none"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M3.5 12.5l1.1-1.1M11.4 4.6l1.1-1.1" fill="none" stroke-linecap="round"/></g><g class="ti-dark"><path d="M12.9 9.6A5.4 5.4 0 0 1 6.4 3.1a5.4 5.4 0 1 0 6.5 6.5z" fill="none" stroke-linejoin="round"/></g></svg><span class="theme-l">Auto</span></button>

  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Command controls">
    <div class="btn-group">
      <button id="btn-pause" type="button" class="btn">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg><span>Pause</span>
      </button>
      <button id="btn-resume" type="button" class="btn">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.9v10.2a.8.8 0 0 0 1.2.7l8-5.1a.8.8 0 0 0 0-1.4l-8-5.1a.8.8 0 0 0-1.2.7z"/></svg><span>Resume</span>
      </button>
      <button id="btn-cancel" type="button" class="btn danger">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg><span>Cancel</span>
      </button>
    </div>
    <form id="note-form" class="cmdbar">
      <svg class="cmd-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5l4 3.5-4 3.5M8 12h5.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <label class="sr-only" for="note">Note for the orchestrator</label>
      <input id="note" type="text" autocomplete="off" maxlength="500" placeholder="Send a note to the orchestrator…">
      <kbd class="kbd" aria-hidden="true">/</kbd>
      <button type="submit" class="send" aria-label="Send note">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 8h10.6M8.5 3.7L12.8 8l-4.3 4.3" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </div>

  <div class="clock" aria-hidden="true"><span id="mission-clock" class="clk-t">T+ 00:00:00</span><span id="utc-clock" class="clk-u">UTC --:--:--</span></div>

  <div id="confirm" class="confirm" role="alertdialog" aria-labelledby="confirm-t" hidden>
    <p id="confirm-t">Cancel the goal? This stops the pulse and cannot be undone.</p>
    <button id="confirm-yes" type="button" class="btn danger solid">Yes, cancel</button>
    <button id="confirm-no" type="button" class="btn">Keep running</button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="stats" id="stats" aria-label="Run statistics">
    <div class="stat"><span class="stat-l">Tasks</span><span class="stat-v tnum" id="st-tasks"><i class="skeleton-text sk-s"></i></span><span class="stat-bar"><i id="st-tasks-bar"></i></span></div>
    <div class="stat"><span class="stat-l">Ticks</span><span class="stat-v tnum" id="st-ticks"><i class="skeleton-text sk-s"></i></span><span class="stat-bar"><i id="st-ticks-bar"></i></span></div>
    <div class="stat"><span class="stat-l">Spend</span><span class="stat-v tnum" id="st-spend"><i class="skeleton-text sk-s"></i></span><span class="stat-bar"><i id="st-spend-bar"></i></span></div>
    <div class="stat"><span class="stat-l">Uptime</span><span class="stat-v tnum" id="st-uptime"><i class="skeleton-text sk-s"></i></span></div>
  </div>

  <svg id="graph" viewBox="90 70 820 480" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Crew graph: orchestrator and crew">
    <defs>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="glow-s" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
      <radialGradient id="core-fill" cx="50%" cy="38%" r="75%">
        <stop offset="0" class="cf-a"/><stop offset="1" class="cf-b"/>
      </radialGradient>
    </defs>
    <g id="g-deps"></g>
    <g id="g-edges"></g>
    <g id="g-agents"></g>
    <g id="g-orch"></g>
  </svg>
  <p id="empty" class="empty" hidden></p>
  <div class="legend" aria-hidden="true">
    <span><i class="lg s-running"></i>running</span><span><i class="lg s-idle"></i>idle</span>
    <span><i class="lg s-stalled"></i>stalled</span><span><i class="lg s-errored"></i>errored</span>
  </div>
  <span id="updated" class="updated"><i class="live-dot"></i><span id="updated-t">Loading…</span></span>
</main>

<aside id="drawer" class="drawer" aria-labelledby="dr-title" hidden>
  <div class="dr-grab" aria-hidden="true"></div>
  <div class="dr-head">
    <h2 id="dr-title"></h2>
    <button id="dr-close" type="button" class="icon-btn" aria-label="Close details">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="dr-body" class="dr-body"></div>
</aside>

<section id="dock" class="dock" aria-label="Telemetry and manifest">
  <div class="dock-bar">
    <div class="tabs" role="tablist" aria-label="Dock views">
      <button id="tab-events" class="tab" role="tab" type="button" aria-selected="true" aria-controls="pane-events">Telemetry <span id="cnt-events" class="count tnum">0</span></button>
      <button id="tab-tasks" class="tab" role="tab" type="button" aria-selected="false" aria-controls="pane-tasks" tabindex="-1">Manifest <span id="cnt-tasks" class="count tnum">0</span></button>
    </div>
    <span id="dock-sum" class="dock-sum"></span>
    <button id="dock-toggle" class="icon-btn dock-toggle" type="button" aria-expanded="true" aria-controls="dock-body" aria-label="Collapse telemetry and manifest">
      <svg viewBox="0 0 16 16" aria-hidden="true" class="chev"><path d="M3.5 6.2l4.5 4.3 4.5-4.3" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="dock-body" class="dock-body">
    <div id="pane-events" class="pane" role="tabpanel" aria-labelledby="tab-events">
      <div class="filterbar">
        <label class="sr-only" for="ev-filter">Filter events by type</label>
        <select id="ev-filter"><option value="">All types</option></select>
        <label class="sr-only" for="ev-search">Search events</label>
        <input id="ev-search" type="search" placeholder="Search payloads…" autocomplete="off">
        <span id="ev-count" class="filter-count tnum"></span>
        <button id="ev-prompts" type="button" class="linkbtn" aria-pressed="false" hidden>show prompts</button>
      </div>
      <div id="events" class="scroll events" tabindex="0" aria-label="Telemetry stream"><div class="sk-rows"><i></i><i></i><i></i><i></i></div></div>
    </div>
    <div id="pane-tasks" class="pane" role="tabpanel" aria-labelledby="tab-tasks" hidden>
      <div id="tasks" class="scroll tasklist" tabindex="0" aria-label="Manifest by status"><div class="sk-rows"><i></i><i></i><i></i></div></div>
    </div>
  </div>
</section>
<script src="app.js?v=26"></script>
<script src="particles.js?v=14"></script>
<script src="boot.js?v=2"></script>
<script src="global.js?v=3"></script>
<script src="debug.js?v=1"></script>
</body>
</html>
